name: SOYUZ website verification
on:
  push:
    branches: [codex/soyuz-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install beautifulsoup4==4.14.3 tinycss2==1.5.1 fonttools==4.68.0 brotli==1.2.0 Pillow==12.3.0
      - run: python scripts/bootstrap-public.py
      - run: node scripts/check-ci.mjs source
      - run: pnpm check
      - run: pnpm build
      - run: node scripts/check-ci.mjs runtime
      - run: pnpm build
        env:
          SOYUZ_RELEASE: '1'
      - run: node scripts/check-ci.mjs release
      - run: python scripts/prepare-tilda-release.py
      - run: node scripts/check-ci.mjs package
      - uses: actions/upload-artifact@v7
        with:
          name: soyuz-tilda-package
          path: deploy/out/
          retention-days: 14
