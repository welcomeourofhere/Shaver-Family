name: SOYUZ VK Work Albums
on:
  workflow_dispatch:
    inputs:
      album_ids:
        description: 'Explicit album IDs from the discovery catalog; empty lists albums only'
        required: false
        default: ''
  push:
    branches: ['codex/soyuz-photos-read']
    paths:
      - 'soyuz/scripts/vk-work-albums.py'
      - 'soyuz/tests/vk_work_albums_test.py'
      - '.github/workflows/soyuz-works.yml'
permissions:
  contents: read
concurrency:
  group: soyuz-vk-work-albums
  cancel-in-progress: false
env:
  # Stage 2: set only album IDs verified from the stage-1 catalog.
  SOYUZ_WORK_ALBUM_IDS: ''
defaults:
  run:
    working-directory: soyuz
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the read-only API boundary
        run: python -m unittest discover -s tests -p 'vk_work_albums_test.py'
      - name: Read public SOYUZ photo metadata
        env:
          SOYUZ_VK_TOKEN: ${{ secrets.SOYUZ_VK_TOKEN || secrets.VK_TOKEN }}
          ALBUM_IDS: ${{ inputs.album_ids || env.SOYUZ_WORK_ALBUM_IDS }}
        shell: bash
        run: python scripts/vk-work-albums.py --album-ids "$ALBUM_IDS" --output artifacts/vk-works.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soyuz-vk-work-albums
          retention-days: 7
          if-no-files-found: warn
          path: |
            soyuz/artifacts/vk-works.json
            soyuz/artifacts/vk-works.error.json
